name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && sw_vers

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble and ad-hoc sign the app
        run: make app

      - name: Verify the signature
        run: |
          codesign --verify --deep --strict --verbose=2 SlideSense.app
          codesign -dv SlideSense.app 2>&1 | grep -E "Identifier|Signature|flags"

      - name: Zip the app
        if: github.event_name == 'push'
        run: zip -qry -X "SlideSense-${GITHUB_SHA::7}.zip" SlideSense.app

      - name: Upload a runnable app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: SlideSense-${{ github.sha }}
          path: SlideSense-*.zip
          retention-days: 14
